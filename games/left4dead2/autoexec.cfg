// left4dead2/cfg/autoexec.cfg
// L4D2 autoexec - balanced (keeps shadows, bump, specular, HDR)
// Target: i5-1235U + Iris Xe, 60 Hz. Delete this file to restore defaults.
// Sources: community autoexecs (Hanricus/L4D2-Autoexec-Graphics-Boost, Steam guide 3499718671).
// Unknown commands only print an error in the console; they are harmless.

// ----- Frame cap -----
fps_max 60                    // monitor is 60 Hz. If you enable vsync, try 59.
mat_vsync 0

// ----- Loading / stutter -----
cl_forcepreload 1             // preload models/sounds into RAM (8 GB is enough); less stutter in hordes
sv_forcepreload 1

// ----- Threading (CPU is the bottleneck in hordes) -----
cl_threaded_bone_setup 1
r_threaded_particles 1
r_threaded_renderables 1

// ----- Horde cost: ragdolls, debris, gibs -----
cl_ragdoll_fade_time 3        // corpses fade faster
cl_ragdoll_maxcount 8         // max simultaneous ragdolls
func_break_max_pieces 0       // no debris from breakable props
props_break_max_pieces 0

// ----- Cheap visual savings that are barely noticeable -----
mat_grain_scale_override 0    // film grain off
mat_reducefillrate 1          // helps integrated GPUs
r_dynamic 0                   // dynamic lights (may have no effect in l4d2); set 1 if explosions look dull
r_eyemove 1

// ----- Optional, uncomment one at a time if still below 60 -----
//r_shadowrendertotexture 0   // simpler shadows
//r_drawflecks 0              // no bullet impact flecks
//r_drawdetailprops 0         // no grass/small details
//mat_viewportscale 0.9       // render at 90% resolution (try 0.8)

// ----- Utility -----
bind "F10" "toggle cl_showfps 0 1"

echo "autoexec loaded"
